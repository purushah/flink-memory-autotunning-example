apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-memory-autotuning-example
  namespace: default
spec:
  image: flink:1.20.0
  flinkVersion: v1_20
  serviceAccount: flink

  # Flink configuration with AUTOSCALING and autotuning enabled
  flinkConfiguration:
    # ========== AUTOSCALING CONFIGURATION ==========
    # Enable the autoscaler for both scaling and memory tuning
    job.autoscaler.enabled: "true"

    # Enable parallelism/TaskManager autoscaling
    job.autoscaler.scaling.enabled: "true"

    # Enable memory autotuning (set to false for dry-run/recommendations only)
    job.autoscaler.memory.tuning.enabled: "true"

    # Maximize managed memory - beneficial for RocksDB state backend
    job.autoscaler.memory.tuning.maximize-managed-memory: "true"

    # Adjust memory overhead (default is 0.2 = 20%)
    job.autoscaler.memory.tuning.overhead: "0.3"

    # Configure state backend to RocksDB (benefits from memory tuning)
    state.backend.type: rocksdb
    state.backend.incremental: "true"

    # Checkpointing configuration
    execution.checkpointing.interval: 60s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.timeout: 10min

    # High availability (optional but recommended for production)
    high-availability.type: kubernetes
    high-availability.storageDir: file:///flink-data/ha

    # Restart strategy
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 10s
    restart-strategy.exponential-delay.max-backoff: 2min
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"

    # ========== AUTOSCALER TUNING ==========
    # Metrics collection window - larger window for more stable scaling decisions
    job.autoscaler.metrics.window: 3min

    # Target utilization for scaling decisions (70% target)
    job.autoscaler.target.utilization: "0.7"
    job.autoscaler.target.utilization.boundary: "0.15"

    # Scaling boundaries - allow aggressive scaling
    job.autoscaler.scale-up.max-factor: "2.0"    # Can double parallelism
    job.autoscaler.scale-down.max-factor: "0.5"  # Can halve parallelism

    # Stabilization to prevent flapping, but allow responsive scaling
    job.autoscaler.stabilization.interval: 1min
    job.autoscaler.scale-up.grace-period: 30s
    job.autoscaler.scale-down.grace-period: 2min  # More conservative on scale-down

    # Enable vertex-level scaling
    job.autoscaler.vertex.scaling.enabled: "true"
    job.autoscaler.vertex.min-parallelism: "1"
    job.autoscaler.vertex.max-parallelism: "200"

    # Metrics reporting
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter

  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 1

  taskManager:
    # Note: These represent the MAXIMUM memory that autotuning will use
    # The autoscaler will adjust memory pools within these limits based on actual usage
    resource:
      memory: "4096m"
      cpu: 2
    # Do NOT set replicas - let autoscaler manage this dynamically
    # Autoscaler will scale between min (2-3) and max (20-30+) TaskManagers
    # based on load patterns

  # Pod template for additional customization (optional)
  podTemplate:
    apiVersion: v1
    kind: Pod
    metadata:
      name: pod-template
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: flink-data
              mountPath: /flink-data
      volumes:
        - name: flink-data
          emptyDir: {}

  job:
    jarURI: local:///opt/flink/lib/flink-memory-autotunning-example-1.0.0.jar
    entryClass: com.yahoo.flink.memory.MemoryAutotuningJob
    # Initial parallelism - autoscaler will adjust this based on load
    # High initial value to demonstrate scale-up capability
    parallelism: 50
    upgradeMode: savepoint
    state: running
    allowNonRestoredState: true

    # Initial savepoint (optional, for restoring from previous runs)
    # initialSavepointPath: s3://your-bucket/savepoints/savepoint-xxxxx

---
# EXPECTED BEHAVIOR:
#
# Phase 1 (0-10 min): HIGH LOAD (100,000 events/sec)
#   - Autoscaler detects high CPU/backpressure
#   - Scales UP parallelism across vertices
#   - Increases TaskManager count to 20-30+
#   - Monitor: kubectl get pods -l component=taskmanager -w
#
# Phase 2 (10-20 min): LOW LOAD (500 events/sec)
#   - Autoscaler detects low utilization
#   - Scales DOWN parallelism
#   - Reduces TaskManager count to 2-3
#   - Some TMs will be terminated
#
# Phase 3 (20-30 min): HIGH LOAD again (100,000 events/sec)
#   - Cycle repeats - scales back up
#
# To monitor:
#   kubectl get flinkdeployment flink-memory-autotuning-example -o yaml | grep -A 50 autoScalerInfo
#   kubectl logs deployment/flink-kubernetes-operator-* | grep -i autoscaler
