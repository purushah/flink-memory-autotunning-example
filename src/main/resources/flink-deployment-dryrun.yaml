apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-memory-autotuning-dryrun
  namespace: default
spec:
  image: flink:1.20.0
  flinkVersion: v1_20
  serviceAccount: flink

  # Flink configuration with autotuning in DRY-RUN mode
  # In this mode, the autoscaler will analyze memory usage and provide
  # recommendations WITHOUT actually applying any changes
  flinkConfiguration:
    # Enable the autoscaler
    job.autoscaler.enabled: "true"

    # DISABLE memory autotuning - dry-run mode (recommendations only)
    # The autoscaler will log recommendations but not apply them
    job.autoscaler.memory.tuning.enabled: "false"

    # Still configure these for when you switch to automatic mode
    job.autoscaler.memory.tuning.maximize-managed-memory: "true"
    job.autoscaler.memory.tuning.overhead: "0.3"

    # Configure state backend to RocksDB
    state.backend.type: rocksdb
    state.backend.incremental: "true"

    # Checkpointing configuration
    execution.checkpointing.interval: 60s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.timeout: 10min

    # High availability
    high-availability.type: kubernetes
    high-availability.storageDir: file:///flink-data/ha

    # Restart strategy
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 10s
    restart-strategy.exponential-delay.max-backoff: 2min
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"

    # Autoscaler configuration
    job.autoscaler.metrics.window: 5min
    job.autoscaler.target.utilization: "0.7"
    job.autoscaler.stabilization.interval: 2min

    # Enable detailed logging for dry-run analysis
    # Check operator logs to see recommendations
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter

  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 1

  taskManager:
    resource:
      memory: "4096m"
      cpu: 2
    replicas: 3

  podTemplate:
    apiVersion: v1
    kind: Pod
    metadata:
      name: pod-template
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: flink-data
              mountPath: /flink-data
      volumes:
        - name: flink-data
          emptyDir: {}

  job:
    jarURI: local:///opt/flink/lib/flink-memory-autotunning-example.jar
    entryClass: com.yahoo.flink.memory.MemoryAutotuningJob
    parallelism: 6
    upgradeMode: savepoint
    state: running

---
# Instructions for viewing dry-run recommendations:
#
# 1. Deploy this configuration:
#    kubectl apply -f flink-deployment-dryrun.yaml
#
# 2. Wait for the job to run and autoscaler to collect metrics (5-10 minutes)
#
# 3. View the FlinkDeployment status for recommendations:
#    kubectl describe flinkdeployment flink-memory-autotuning-dryrun
#
# 4. Check operator logs for detailed analysis:
#    kubectl logs deployment/flink-kubernetes-operator-controller-manager | grep autoscaler
#
# 5. Look for log entries like:
#    "Autoscaler recommendations: ..."
#    "Proposed memory configuration: ..."
#
# 6. Once you're satisfied with recommendations, switch to automatic mode:
#    - Change job.autoscaler.memory.tuning.enabled to "true"
#    - Apply the updated configuration
#    kubectl apply -f flink-deployment.yaml
